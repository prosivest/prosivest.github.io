# 起始 URL（换成自己的域名）
baseURL: https://prosivest.github.io
# 语言代码（zh-简体中文）
languageCode: zh-cn
#languageCode: en-us
# 网站标题
title: 想上天的鱼
#主题
theme: PaperMod
# 是否启用 Emoji
enableEmoji: true
# 压缩输出静态文件
minify:
  # 是否不压缩 XML 文件
  disableXML: true
  minifyOutput: true
# 每页显示的文章数量
pagination:
  pagerSize: 6

defaultContentLanguage: zh # 最顶部首先展示的语言页面

menu:
  main:
    - name: 文章
      url: posts/
      weight: 1
    - name: 归档
      url: archives/
      weight: 10
    - name: 标签
      url: tags/
      weight: 15
    - name: 搜索
      url: search/
      weight: 20
    - name: 💡关于
      url: /about/
      weight: 25
    # - name: 导航
    #   url: https://mhx.edu.deal/
    #   weight: 30
    - name: Github
      url: https://github.com/prosivest
      weight: 35

outputs:
  home:
    - HTML
    - RSS
    - JSON

# 全局配置
params:
  #设置环境为生产环境
  env: production
  # 日期格式
  DateFormat: 2006-01-02
  # 默认主题
  defaultTheme: auto
  # 是否启用主题切换按钮
  disableThemeToggle: false
  # 是否启用面包屑导航
  ShowBreadCrumbs: true
  # 是否显示代码复制按钮
  ShowCodeCopyButtons: true
  #在帖子下方显示上一条和下一条帖子
  ShowPostNavLinks: true
  # 是否显示阅读时间
  ShowReadingTime: true
  # 是否显示字数统计
  ShowWordCount: true
  # 使用 Hugo 的默认目录树而不是自定义的
  UseHugoToc: true
  # 是否禁用首页滚动到顶部
  disableScrollToTop: false
  # 禁用首帖无卡特殊外观
  # disableSpecial1stPost: true
  # 是否启用分享按钮
  ShowShareButtons: true
  # 是否在页面显示 RSS 按钮
  ShowRssButtonInSectionTermList: true
  # 是否启用评论系统
  comments: false
  # 是否显示目录
  showtoc: true
  # 是否默认展开文章目录
  tocopen: true
  ShowPageNums: true

  # === 新增作者信息 ===
  author:
    name: "想上天的鱼"
    email: "prosivest@hotmail.com"
    link: "https://github.com/prosivest"
  # =================

  homeInfoParams:
    Title: Hi there 👋
    Content: >

      - **Welcome to my blog**   

      - 欢迎来到我的博客  

      - 记录 分享 成长   

      - 如果您有任何问题，请联系我

      - ✉️ prosivest@hotmail.com

  socialIcons:
    - name: github
      title: View Source on Github
      url: https://github.com/prosivest
    - name: X
      title: Share PaperMod on X/Twitter
      url: https://x.com/

markup:
  goldmark:
    renderer:
      unsafe: true # HUGO 默认转义 Markdown 文件中的 HTML 代码，如需开启的话
  highlight:
    # anchorLineNos: true
    codeFences: true # 代码围栏功能，这个功能一般都要设为 true 的，不然很难看，就是干巴巴的-代码文字，没有颜色。
    guessSyntax: true # 猜测语法
    lineNos: true # 显示行号
    noClasses: false # 使用 class 标签，而不是内嵌的内联样式
    # style: monokai
    style: darcula
